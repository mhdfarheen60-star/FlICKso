<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Ember Skin UGC cover">
  <defs>
    <linearGradient id="ember-bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3B0F05"/>
      <stop offset="0.5" stop-color="#8E2A0C"/>
      <stop offset="1" stop-color="#FF4D00"/>
    </linearGradient>
    <radialGradient id="ember-orb" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#FFE0C2"/>
      <stop offset="0.55" stop-color="#FF9A62"/>
      <stop offset="1" stop-color="#C33A0A"/>
    </radialGradient>
    <radialGradient id="ember-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD2A8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFD2A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#ember-bg)"/>
  <circle cx="420" cy="400" r="300" fill="url(#ember-glow)"/>
  <circle cx="420" cy="400" r="170" fill="url(#ember-orb)"/>
  <circle cx="590" cy="270" r="60" fill="#FFD2A8" fill-opacity="0.35"/>
  <circle cx="250" cy="530" r="90" fill="#3B0F05" fill-opacity="0.35"/>

  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F4F1E8" fill-opacity="0.65" letter-spacing="6">UGC — 2024</text>
  <text x="740" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F4F1E8" fill-opacity="0.75" letter-spacing="4" text-anchor="end">05</text>

  <text x="54" y="832" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="170" font-weight="900" fill="#F4F1E8" letter-spacing="-8">EMBER</text>
  <text x="62" y="892" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#3B0F05" letter-spacing="10">SKIN — GLOW, UNFILTERED</text>
  <text x="62" y="950" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#F4F1E8" fill-opacity="0.6" letter-spacing="3">REAL SKIN. REAL LIGHT.</text>
</svg>
