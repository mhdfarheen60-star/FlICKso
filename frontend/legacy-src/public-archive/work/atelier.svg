<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Atelier Nine product photography cover">
  <defs>
    <linearGradient id="atelier-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE9DC"/>
      <stop offset="1" stop-color="#DCD3C0"/>
    </linearGradient>
    <linearGradient id="atelier-clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C96A42"/>
      <stop offset="1" stop-color="#8E3D22"/>
    </linearGradient>
    <pattern id="atelier-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#1A1712" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#atelier-bg)"/>
  <rect width="800" height="1000" fill="url(#atelier-grid)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#1A1712" stroke-opacity="0.2"/>

  <ellipse cx="560" cy="430" rx="210" ry="270" fill="url(#atelier-clay)"/>
  <ellipse cx="560" cy="430" rx="210" ry="270" fill="none" stroke="#1A1712" stroke-opacity="0.2"/>
  <path d="M350 430a210 270 0 0 1 420 0" fill="none" stroke="#F4F1E8" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="120" y="610" width="180" height="220" fill="#1A1712" fill-opacity="0.08"/>
  <rect x="120" y="610" width="180" height="220" fill="none" stroke="#1A1712" stroke-opacity="0.25"/>
  <line x1="120" y1="720" x2="300" y2="720" stroke="#1A1712" stroke-opacity="0.2"/>

  <text x="70" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1A1712" fill-opacity="0.55" letter-spacing="6">PRODUCT — 2024</text>
  <text x="730" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8E3D22" letter-spacing="4" text-anchor="end">03</text>

  <text x="66" y="812" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#1A1712" letter-spacing="2">ATELIER</text>
  <text x="70" y="892" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#8E3D22" letter-spacing="2">NINE</text>
  <text x="70" y="942" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1A1712" fill-opacity="0.55" letter-spacing="4">OBJECTS OF INTENTION</text>
</svg>
