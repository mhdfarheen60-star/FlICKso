<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Pulse Audio campaign cover">
  <defs>
    <linearGradient id="pulse-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131A"/>
      <stop offset="0.55" stop-color="#0C1E26"/>
      <stop offset="1" stop-color="#05090C"/>
    </linearGradient>
    <linearGradient id="pulse-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D00"/>
      <stop offset="0.5" stop-color="#FFB27A"/>
      <stop offset="1" stop-color="#F4F1E8"/>
    </linearGradient>
    <radialGradient id="pulse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF4D00" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF4D00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#pulse-bg)"/>
  <circle cx="400" cy="410" r="330" fill="url(#pulse-glow)"/>

  <g fill="none" stroke="#F4F1E8" stroke-opacity="0.13">
    <circle cx="400" cy="410" r="110"/>
    <circle cx="400" cy="410" r="190"/>
    <circle cx="400" cy="410" r="270"/>
    <circle cx="400" cy="410" r="350"/>
  </g>

  <g fill="url(#pulse-wave)">
    <rect x="150" y="390" width="18" height="40" rx="9"/>
    <rect x="182" y="350" width="18" height="120" rx="9"/>
    <rect x="214" y="300" width="18" height="220" rx="9"/>
    <rect x="246" y="370" width="18" height="80" rx="9"/>
    <rect x="278" y="250" width="18" height="320" rx="9"/>
    <rect x="310" y="330" width="18" height="160" rx="9"/>
    <rect x="342" y="180" width="18" height="460" rx="9"/>
    <rect x="374" y="290" width="18" height="240" rx="9"/>
    <rect x="406" y="210" width="18" height="400" rx="9"/>
    <rect x="438" y="340" width="18" height="140" rx="9"/>
    <rect x="470" y="270" width="18" height="280" rx="9"/>
    <rect x="502" y="360" width="18" height="100" rx="9"/>
    <rect x="534" y="310" width="18" height="200" rx="9"/>
    <rect x="566" y="380" width="18" height="60" rx="9"/>
    <rect x="598" y="350" width="18" height="120" rx="9"/>
    <rect x="630" y="400" width="18" height="20" rx="10"/>
  </g>

  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F4F1E8" fill-opacity="0.55" letter-spacing="6">CAMPAIGN — 2025</text>
  <text x="740" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FF4D00" letter-spacing="4" text-anchor="end">02</text>

  <text x="56" y="800" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="158" font-weight="900" fill="#F4F1E8" letter-spacing="-7">PULSE</text>
  <text x="62" y="856" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FF4D00" letter-spacing="7">AUDIO — NC SERIES</text>
