<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Monolith motion design cover">
  <defs>
    <linearGradient id="mono-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C1C"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="mono-slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#mono-bg)"/>

  <rect x="90" y="150" width="300" height="620" fill="url(#mono-slab)" stroke="#F4F1E8" stroke-opacity="0.15"/>
  <rect x="420" y="300" width="290" height="470" fill="#0F0F0F" stroke="#F4F1E8" stroke-opacity="0.2"/>
  <rect x="420" y="300" width="290" height="16" fill="#FF4D00"/>

  <g stroke="#F4F1E8" stroke-opacity="0.08">
    <line x1="90" y1="250" x2="390" y2="250"/>
    <line x1="90" y1="350" x2="390" y2="350"/>
    <line x1="90" y1="450" x2="390" y2="450"/>
    <line x1="90" y1="550" x2="390" y2="550"/>
    <line x1="90" y1="650" x2="390" y2="650"/>
    <line x1="190" y1="150" x2="190" y2="770"/>
    <line x1="290" y1="150" x2="290" y2="770"/>
  </g>

  <text x="60" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F4F1E8" fill-opacity="0.55" letter-spacing="6">MOTION — 2024</text>
  <text x="740" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#FF4D00" letter-spacing="4" text-anchor="end">06</text>

  <text x="52" y="880" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="100" font-weight="900" fill="#F4F1E8" letter-spacing="-4">MONOLITH</text>
  <text x="58" y="930" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FF4D00" letter-spacing="7">CONCRETE. LIGHT. MOTION.</text>
</svg>
